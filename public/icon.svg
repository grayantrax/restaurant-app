<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="receipt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
  </defs>

  <!-- Background with safe padding for maskable icon -->
  <rect width="512" height="512" rx="96" fill="url(#bg)" />

  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#f59e0b" stroke-width="6" stroke-opacity="0.25" />

  <!-- Restaurant Cloche / Cooking Pot Base -->
  <path d="M 128 340 L 384 340 A 16 16 0 0 1 400 356 L 400 364 A 8 8 0 0 1 392 372 L 120 372 A 8 8 0 0 1 112 364 L 112 356 A 16 16 0 0 1 128 340 Z" fill="url(#gold)" />
  
  <!-- Food Dome / Cloche Lid -->
  <path d="M 144 330 C 144 210, 368 210, 368 330 Z" fill="url(#gold)" opacity="0.95" />
  
  <!-- Handle Knob -->
  <ellipse cx="256" cy="205" rx="24" ry="16" fill="#fbbf24" />
  <rect x="250" y="215" width="12" height="15" fill="#d97706" />

  <!-- Thermal Receipt Paper Rising from Register -->
  <rect x="210" y="100" width="92" height="110" rx="8" fill="url(#receipt)" filter="drop-shadow(0px 8px 16px rgba(0,0,0,0.5))" />
  <!-- Receipt text lines -->
  <rect x="222" y="116" width="68" height="6" rx="3" fill="#0f172a" />
  <rect x="222" y="128" width="50" height="5" rx="2" fill="#64748b" />
  <rect x="222" y="139" width="58" height="5" rx="2" fill="#64748b" />
  <rect x="222" y="150" width="68" height="5" rx="2" fill="#d97706" />
  <rect x="222" y="162" width="40" height="5" rx="2" fill="#0f172a" />
  <!-- Receipt serrated tear edge -->
  <path d="M 210 210 L 219 204 L 228 210 L 237 204 L 246 210 L 255 204 L 264 210 L 273 204 L 282 210 L 291 204 L 302 210 L 302 200 L 210 200 Z" fill="url(#receipt)" />

  <!-- Matooke Leaf Accent -->
  <path d="M 120 280 C 100 240, 130 180, 180 180 C 160 210, 160 250, 120 280 Z" fill="#22c55e" opacity="0.85" />
  
  <!-- POS Badge UGX -->
  <rect x="180" y="400" width="152" height="38" rx="19" fill="#1e293b" stroke="#f59e0b" stroke-width="3" />
  <text x="256" y="425" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#fbbf24" letter-spacing="3">UGX • POS</text>
</svg>
